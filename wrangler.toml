"$schema" = "./node_modules/wrangler/config-schema.json"

name = "jstn-site"
main = ".open-next/worker.js"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[secrets]
required = [
  "AUTH_SECRET",
  "AUTH_URL",
  "AUTH_GOOGLE_ID",
  "AUTH_GOOGLE_SECRET",
  "ADMIN_EMAIL",
  "TURSO_DATABASE_URL",
  "TURSO_AUTH_TOKEN",
  "GH_TOKEN",
]

[observability]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[images]
binding = "IMAGES"

# Non-secret runtime vars can live here once you are ready to cut over:
# [vars]
# AUTH_URL = "https://your-domain.example"
# GITHUB_USERNAME = "JustineDevs"
# NEXT_PUBLIC_PRIVACY_POLICY_URL = "https://your-domain.example/privacy"
# NEXT_PUBLIC_TERMS_URL = "https://your-domain.example/terms"
# NEXT_INC_CACHE_R2_PREFIX = "incremental-cache"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "jstn-site"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "jstn-site-next-cache"

[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "jstn-site-next-tag-cache"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

# Secrets to set before production deploy:
# AUTH_SECRET
# AUTH_GOOGLE_ID
# AUTH_GOOGLE_SECRET
# ADMIN_EMAIL
# TURSO_DATABASE_URL
# TURSO_AUTH_TOKEN
# GH_TOKEN
