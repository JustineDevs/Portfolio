# On push of tag v*, publish a GitHub Release.
#
# Standard (required): docs/releases/<tag>.md must exist (e.g. docs/releases/v0.1.1.md).
# The release body is loaded from that file; GitHub auto-generated notes are appended after it.
#
# Before tagging: bump package.json version, add docs/releases/v<version>.md, then:
#   pnpm run release:git-tag
#   git push origin v<version>
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-notes:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require curated release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error title=Missing release notes::Required file missing: $NOTES"
            echo "Add docs/releases/${TAG}.md before pushing this tag. See docs/releases/README.md."
            exit 1
          fi
          echo "Release body: $NOTES"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
