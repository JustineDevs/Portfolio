# On push of tag v*, run the same quality gate as CI, then publish a GitHub Release.
#
# Standard (required): docs/releases/<tag>.md must exist (e.g. docs/releases/v0.1.1.md).
# The release body is loaded from that file; GitHub auto-generated notes are appended after it.
#
# Before tagging: bump package.json version, add docs/releases/v<version>.md, then:
#   pnpm run release:git-tag
#   git push origin v<version>
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AUTH_SECRET: ci-placeholder-auth-secret-must-be-at-least-32-chars
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm run build

  release-notes:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require curated release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error title=Missing release notes::Required file missing: $NOTES"
            echo "Add docs/releases/${TAG}.md before pushing this tag. See docs/releases/README.md."
            exit 1
          fi
          echo "Release body: $NOTES"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
